version: "3.9"
services:
  backend:
    build: ../backend
    ports:
      - "8000:8000"
    env_file: ../.env
    depends_on: [mongo, redis]
  frontend:
    build: ../frontend
    ports:
      - "5173:5173"
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  mongo_data:
